spring.application.name=boff-bike
server.port=${PORT:8080}

# Database (in sviluppo viene avviato automaticamente compose.yaml)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/boffbike}
spring.datasource.username=${DATABASE_USER:boffbike}
spring.datasource.password=${DATABASE_PASSWORD:boffbike}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.docker.compose.lifecycle-management=start-only

# Primo account titolare (creato solo se non esiste)
boff.titolare.email=${BOFF_TITOLARE_EMAIL:}
boff.titolare.password=${BOFF_TITOLARE_PASSWORD:}
boff.titolare.nome=${BOFF_TITOLARE_NOME:Titolare}
boff.titolare.cognome=${BOFF_TITOLARE_COGNOME:}
# Utenti di prova: solo per sviluppo
boff.demo=${BOFF_DEMO:false}

vaadin.launch-browser=false
vaadin.allowed-packages=it.boff.bike

# Fuso orario del negozio (il server può essere in UTC)
boff.fuso-orario=${BOFF_FUSO_ORARIO:Europe/Rome}
# Segreto per il cookie "resta collegato": in produzione impostarlo (es. openssl rand -hex 32)
boff.remember-me-key=${BOFF_REMEMBER_ME_KEY:}
boff.url-pubblico=${BOFF_URL_PUBBLICO:http://localhost:8080}

# Stato dell'app per il monitoraggio (solo /actuator/health, senza dettagli)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Email (facoltativa): impostare SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
# SPRING_MAIL_PASSWORD. Senza SPRING_MAIL_HOST le email vengono solo scritte nel log.
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
boff.email-mittente=${BOFF_EMAIL_MITTENTE:officina@example.com}
boff.nome-negozio=${BOFF_NOME_NEGOZIO:Boff Bike}

# Dietro il proxy HTTPS (Caddy) in produzione
server.forward-headers-strategy=framework
