spring.application.name=boff-bike
server.port=${PORT:8080}
spring.mvc.locale=it_IT

# Database (in sviluppo viene avviato automaticamente compose.yaml)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/boffbike}
spring.datasource.username=${DATABASE_USER:boffbike}
spring.datasource.password=${DATABASE_PASSWORD:boffbike}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.docker.compose.lifecycle-management=start-only

# Primo account titolare (creato solo se non esiste)
boff.titolare.email=${BOFF_TITOLARE_EMAIL:}
boff.titolare.password=${BOFF_TITOLARE_PASSWORD:}
boff.titolare.nome=${BOFF_TITOLARE_NOME:Titolare}
boff.titolare.cognome=${BOFF_TITOLARE_COGNOME:}
# Utenti di prova: solo per sviluppo
boff.demo=${BOFF_DEMO:false}

vaadin.launch-browser=false
vaadin.allowed-packages=it.boff.bike
