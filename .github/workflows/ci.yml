name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test (unit + integrazione con PostgreSQL in Docker)
        run: mvn -B verify
      - name: Build di produzione
        run: mvn -B -Pproduction -DskipTests package
