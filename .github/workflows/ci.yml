name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test (unit + integrazione con PostgreSQL in Docker)
        run: ./mvnw -B verify
      - name: Build di produzione
        run: ./mvnw -B -Pproduction -DskipTests package
